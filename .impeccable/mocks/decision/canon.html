<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#0c0c0e;color:#fff;font-family:Archivo,sans-serif}
header{height:72px;display:flex;align-items:center;padding:0 48px;gap:40px;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:24px;font-style:italic}.logo b{color:#d81e2c}
header nav{display:flex;gap:28px;font-size:15px;color:#bbb;flex:1}
.wa{background:#d81e2c;padding:11px 18px;font-weight:800;border-radius:4px}
.hero{height:520px;margin:24px 48px;background:linear-gradient(90deg,#0c0c0e 30%,#2b2b31);position:relative;padding:80px 64px;border-radius:8px}
.hero:after{content:"";position:absolute;right:60px;top:40px;width:560px;height:440px;background:#3a3a42;border-radius:6px}
.hero h1{font-size:84px;line-height:.95;font-weight:900;max-width:640px;text-transform:uppercase}
.hero p{font-size:20px;color:#bbb;margin:22px 0 30px;max-width:480px}
.hero span{background:#d81e2c;padding:18px 30px;font-weight:800;border-radius:4px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding:0 48px}
.cats div{height:220px;background:#1a1a1e;border-radius:6px;padding:18px;display:flex;align-items:flex-end;font-weight:800;font-size:20px}
</style></head><body>
<header><div class="logo">SIDE<b>PLAY</b></div><nav><span>Rackets</span><span>Fitness</span><span>Basketball</span><span>Goals</span><span>Ride</span><span>Outdoor</span></nav><div class="wa">WhatsApp 71 904 725</div></header>
<div class="hero"><h1>Gear up.<br>Play more.</h1><p>Sports, fitness and outdoor gear for the whole family.</p><span>Shop now</span></div>
<div class="cats"><div>Rackets</div><div>Fitness</div><div>Basketball</div><div>Goals</div><div>Ride</div><div>Outdoor</div></div>
</body></html>
